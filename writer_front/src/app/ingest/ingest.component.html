<div class="ingest-wrapper">
  <div class="ingest-container">
    <form [formGroup]="metaForm" (ngSubmit)="submit()">

      <header class="editor-header">
        <label>标题<span class="required-mark">*</span></label>
        <input type="text" formControlName="title" class="title-input" placeholder="Title">

        <div class="meta-row">
          <div class="meta-field">
            <label>作者</label>
            <input type="text" formControlName="author" placeholder="Writer Name">
          </div>
          <div class="meta-field">
            <label>分类<span class="required-mark">*</span></label>
            <select formControlName="category">
              <option value="">— 选择 —</option>
              <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
            </select>
          </div>
          <div class="meta-field">
            <label>发布时间</label>
            <input type="datetime-local" formControlName="date_time">
          </div>
        </div>
        <div class="lead-image-section">
          <label>Lead Image</label>
          <div class="lead-image-row">
            <div class="lead-thumb"
                 [class.empty]="!leadImagePreview && !leadImageUploading"
                 (click)="leadImgInput.click()">
              <img *ngIf="leadImagePreview as preview" [src]="preview">
              <div class="progress-container" *ngIf="leadImageUploading">
                <div class="progress-bar" [style.width.%]="leadImageProgress"></div>
                <span class="progress-text">{{ leadImageProgress }}%</span>
              </div>
              <span *ngIf="!leadImagePreview && !leadImageUploading" class="lead-thumb-prompt">+ Lead image</span>
            </div>

            <div class="lead-image-side" *ngIf="leadImagePreview">
              <input type="text" class="caption-input" placeholder="Caption (optional)" formControlName="lead_image_caption">
              <div class="lead-image-actions">
                <button type="button" class="replace-media" (click)="leadImgInput.click()">Replace</button>
                <button type="button" class="replace-media lead-remove" (click)="removeLeadImage()">Remove</button>
              </div>
            </div>
          </div>
          <input type="file" #leadImgInput (change)="onLeadImageSelected($event)" hidden accept="image/*">
        </div>
      </header>

      <div class="tiptap-menu-bar">
        <div class="menu-group">
          <button type="button" [disabled]="!activeEditor" (click)="activeEditor!.chain().focus().toggleBold().run()" [class.is-active]="activeEditor?.isActive('bold')">B</button>
          <button type="button" [disabled]="!activeEditor" (click)="activeEditor!.chain().focus().toggleItalic().run()" [class.is-active]="activeEditor?.isActive('italic')">I</button>
          <button type="button" [disabled]="!activeEditor" (click)="activeEditor!.chain().focus().toggleUnderline().run()" [class.is-active]="activeEditor?.isActive('underline')">U</button>
          <button type="button" [disabled]="!activeEditor" (click)="activeEditor!.chain().focus().toggleStrike().run()" [class.is-active]="activeEditor?.isActive('strike')">S</button>
          <button type="button" [disabled]="!activeEditor" (click)="setLink(activeEditor!)" [class.is-active]="activeEditor?.isActive('link')">🔗</button>
        </div>
        <div class="menu-group">
          <button type="button" [disabled]="!activeEditor" (click)="activeEditor!.chain().focus().toggleHeading({ level: 1 }).run()" [class.is-active]="activeEditor?.isActive('heading', { level: 1 })">H1</button>
          <button type="button" [disabled]="!activeEditor" (click)="activeEditor!.chain().focus().toggleHeading({ level: 2 }).run()" [class.is-active]="activeEditor?.isActive('heading', { level: 2 })">H2</button>
          <button type="button" [disabled]="!activeEditor" (click)="activeEditor!.chain().focus().toggleBulletList().run()" [class.is-active]="activeEditor?.isActive('bulletList')">•</button>
          <button type="button" [disabled]="!activeEditor" (click)="activeEditor!.chain().focus().toggleOrderedList().run()" [class.is-active]="activeEditor?.isActive('orderedList')">1.</button>
        </div>
        <div class="menu-group">
          <select class="font-size-select"
                  [disabled]="!activeEditor"
                  [value]="activeEditor?.getAttributes('textStyle')?.['fontSize'] || ''"
                  (change)="onFontSizeChange($event, activeEditor!)">
            <option value="">Default</option>
            <option *ngFor="let size of fontSizes" [value]="size">{{ size }}</option>
          </select>
        </div>
        <!-- Takes the place of the per-block insert pills: media goes in at the caret. -->
        <div class="menu-group">
          <button type="button" [disabled]="!activeEditor" (click)="insertMedia('imageBlock')">📷</button>
          <button type="button" [disabled]="!activeEditor" (click)="insertMedia('videoBlock')">🎥</button>
        </div>
      </div>

      <hr class="editor-divider">

      <div class="status-msg" *ngIf="status">{{ status }}</div>

      <!-- One editor for the whole article. Paragraphs are its text; images
           and videos are atom nodes rendered by ImageBlockComponent /
           VideoBlockComponent, which carry the media markup that used to
           live here. -->
      <div class="canvas">
        <div class="tiptap-wrapper">
          <tiptap-editor [editor]="editor" class="editable-area"></tiptap-editor>
        </div>
      </div>

      <hr class="editor-divider">

      <!-- Placement and lead image: after the body. -->
      <section class="post-meta">
        <label>副标题</label>
        <textarea formControlName="summary" class="summary-input" placeholder="Write a subtitle..."></textarea>

        <div class="meta-row">
          <div class="meta-field">
            <label>浏览量</label>
            <input type="number" min="0" step="1" formControlName="view_count" placeholder="0">
          </div>

          <!-- 位置: at most one front (radio enforces it), 栏目 alongside -->
          <div class="meta-field zone-field">
            <label>位置<span class="required-mark">*</span></label>
            <div class="zone-picker">
              <div class="zone-group">
                <label class="zone-opt" *ngFor="let opt of availableFrontOptions">
                  <input type="radio" formControlName="front" [value]="opt.value"> {{ opt.label }}
                </label>
                <!-- Required, not decoration: a radio group cannot return to
                     unselected once clicked, and 栏目-only is a legal placement. -->
                <label class="zone-opt">
                  <input type="radio" formControlName="front" [value]="null"> 无
                </label>
              </div>
              <div class="zone-group">
                <label class="zone-opt">
                  <input type="checkbox" formControlName="in_column"> 栏目
                </label>
              </div>
            </div>
          </div>

          <div class="meta-field">
            <label>排列<span class="required-mark" *ngIf="!intraSectionZoneDisabled">*</span></label>
            <!-- No [disabled] binding: the control's own disabled state is
                 driven from syncIntraZoneValidity(). -->
            <select formControlName="intra_section_zone">
              <option [ngValue]="null">— 选择 —</option>
              <option *ngFor="let opt of intraSectionZoneOptions" [ngValue]="opt.value">{{ opt.label }}</option>
            </select>
            <div *ngIf="mainCenterReserved" class="zone-notice">只有美洲頭條可以使用主版中心，详情请参考Manual</div>

            <div class="meta-field zone-field">
              <label>分类页位置</label>
              <div class="zone-picker">
                <div class="zone-group">
                  <label class="zone-opt">
                    <input type="checkbox" formControlName="cat_main"> 主板
                  </label>
                  <label class="zone-opt">
                    <input type="checkbox" formControlName="cat_column"> 栏目
                  </label>
                </div>
              </div>
            </div>

            <div class="meta-field">
              <label>分类页排列<span class="required-mark" *ngIf="!categoryIntraDisabled">*</span></label>
              <select formControlName="category_intra">
                <option [ngValue]="null">— 选择 —</option>
                <option *ngFor="let opt of categoryIntraOptions" [ngValue]="opt.value">{{ opt.label }}</option>
              </select>
            </div>
          </div>
        </div>


      </section>

      <div class="editor-actions">
        <div class="toolbar-inline">
          <button type="button" (click)="appendBlock('paragraph')">¶ Text</button>
          <button type="button" (click)="appendBlock('imageBlock')">📷 Image</button>
          <button type="button" (click)="appendBlock('videoBlock')">🎥 Video</button>
        </div>
        <button type="submit" class="submit-btn" [class.success-state]="isSuccess"
                [disabled]="metaForm.invalid || isSubmitting || isSuccess || isAnyBlockUploading">
          <ng-container *ngIf="!isSuccess">
            {{ isAnyBlockUploading ? 'Uploading Media...' : (editingId ? 'Update Article' : 'Publish to Database') }}
          </ng-container>
          <ng-container *ngIf="isSuccess">✓ Success</ng-container>
        </button>
      </div>

    </form>
  </div>
</div>
