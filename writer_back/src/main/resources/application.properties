spring.application.name=demo
spring.config.import=file:/home/rembrandt/.env[.properties]

spring.datasource.url=jdbc:mariadb://${db_location}/phoenix_web
spring.datasource.username=${db_user}
spring.datasource.password=${db_pswd}


server.port=9000
server.address=127.0.0.1

# Behind nginx: build redirects and client IPs from X-Forwarded-*, not from
# the loopback socket Tomcat actually sees.
server.forward-headers-strategy=NATIVE

spring.servlet.multipart.max-file-size=40MB
spring.servlet.multipart.max-request-size=40MB
# On a 413 Tomcat must drain the rest of the body before it can send the
# response; otherwise the client sees a connection reset, not an error.
server.tomcat.max-swallow-size=42MB

server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
logging.level.org.springframework.security=INFO